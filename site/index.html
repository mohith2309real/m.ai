<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m.ai — talk to the potatoes</title>
<style>
  :root{
    --bg:#0b0d14; --panel:#11141f; --panel2:#161a28; --line:#232838;
    --ink:#e8eaf3; --dim:#8b93a7; --faint:#5b6478;
    --violet:#7c5cff; --teal:#31d0aa; --grad:linear-gradient(135deg,#7c5cff,#4aa8ff);
    --user:linear-gradient(135deg,#7c5cff,#4aa8ff);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button{font:inherit;cursor:pointer;color:inherit}
  input,textarea{font:inherit}
  a{color:#7fb0ff}
  .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ── login gate ── */
  #login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 600px at 50% -10%,#1a1436 0%,var(--bg) 60%)}
  #login.show{display:flex}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:34px 30px;box-shadow:0 30px 80px -30px #000}
  .logo{font-weight:800;font-size:34px;letter-spacing:-1px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 26px;font-size:13.5px}
  .btn{width:100%;border:none;border-radius:11px;padding:12px 14px;font-weight:600;
    background:var(--grad);color:#fff;transition:filter .15s;margin-top:10px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  .field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;color:var(--ink);margin-top:10px;outline:none}
  .field:focus{border-color:var(--violet)}
  .or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:20px 0 6px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .err{color:#ff8080;font-size:12.5px;min-height:16px;margin-top:10px}
  .swap{color:var(--dim);font-size:13px;text-align:center;margin-top:16px}
  .swap b{color:#7fb0ff;cursor:pointer}

  /* ── app shell ── */
  #app{display:none;height:100%;grid-template-columns:270px 1fr}
  #app.show{display:grid}
  @media(max-width:720px){#app.show{grid-template-columns:1fr}
    #side{position:fixed;z-index:20;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
    #side.open{transform:none}}
  #side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-top{padding:16px 14px;border-bottom:1px solid var(--line)}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.5px}
  .newbtn{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--panel2);
    border-radius:10px;padding:10px;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
  .newbtn:hover{border-color:var(--violet)}
  #chatlist{flex:1;overflow:auto;padding:8px}
  .chatrow{padding:9px 11px;border-radius:9px;color:var(--dim);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
  .chatrow:hover{background:var(--panel2);color:var(--ink)}
  .chatrow.active{background:var(--panel2);color:var(--ink)}
  .chatrow .x{color:var(--faint);opacity:0;font-size:16px;line-height:1}
  .chatrow:hover .x{opacity:1}
  .chatrow .x:hover{color:#ff8080}
  .side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--grad);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .who{flex:1;min-width:0}
  .who .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .e{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon{background:none;border:none;color:var(--dim);font-size:15px;padding:6px;border-radius:8px}
  .icon:hover{background:var(--panel2);color:var(--ink)}

  /* ── main ── */
  #main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .menu{display:none;background:none;border:none;font-size:20px;color:var(--dim)}
  @media(max-width:720px){.menu{display:block}}
  select.model{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:8px 10px;outline:none;max-width:220px}
  .dot{width:8px;height:8px;border-radius:50%;background:#3ad07f;flex:0 0 auto}
  .dot.off{background:#ff6b6b}
  .status{color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:7px;margin-left:auto}
  #scroll{flex:1;overflow:auto;min-height:0}
  .thread{max-width:760px;margin:0 auto;padding:26px 20px 40px}
  .empty{color:var(--faint);text-align:center;margin-top:16vh;font-size:15px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .msg{display:flex;gap:14px;margin:22px 0}
  .msg .role{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:700}
  .msg.user .role{background:var(--grad);color:#fff}
  .msg.bot .role{background:var(--panel2);border:1px solid var(--line)}
  .msg .body{padding-top:3px;white-space:pre-wrap;word-wrap:break-word;flex:1;min-width:0}
  .msg.bot .body{color:#dfe3ee}
  .cursor::after{content:"▋";color:var(--violet);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .composer{border-top:1px solid var(--line);padding:14px 18px}
  .composer .wrap{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
  .composer .wrap:focus-within{border-color:var(--violet)}
  #input{flex:1;background:none;border:none;color:var(--ink);resize:none;outline:none;
    max-height:180px;padding:6px 0;line-height:1.5}
  .send{background:var(--grad);border:none;color:#fff;border-radius:10px;width:40px;height:40px;
    flex:0 0 auto;font-size:17px;display:flex;align-items:center;justify-content:center}
  .send:disabled{opacity:.4}
  .foot{max-width:760px;margin:8px auto 0;color:var(--faint);font-size:11.5px;text-align:center}

  /* ── settings modal ── */
  #modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  #modal.show{display:flex}
  .modal-card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
  .modal-card h3{margin:0 0 4px}
  .modal-card p{color:var(--dim);font-size:13px;margin:0 0 16px}
  .lbl{font-size:12px;color:var(--dim);margin:14px 0 4px;display:block}
  .row{display:flex;gap:10px;margin-top:18px}
</style>
</head>
<body>

<!-- ═══════════ FILL THESE IN ONCE (see deploy/SITE_SETUP.md) ═══════════ -->
<script>
  // 1) Firebase web config — Firebase console → Project settings → your web app.
  //    These values are safe to ship in client code (that's how Firebase works).
  window.FIREBASE_CONFIG = {
    apiKey:     "PASTE_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId:  "YOUR_PROJECT",
    appId:      "PASTE_FIREBASE_APP_ID"
  };
  // 2) Where the potato brain lives — your Hugging Face Space URL (no trailing slash).
  window.DEFAULT_API = "https://YOUR-USER-m-ai.hf.space";
</script>
<!-- ════════════════════════════════════════════════════════════════════ -->

<!-- login -->
<div id="login">
  <div class="card">
    <h1 class="logo grad">m.ai</h1>
    <p class="sub">from-scratch potato models you can actually talk to. sign in to keep your chats.</p>
    <button class="btn ghost" id="googleBtn">Continue with Google</button>
    <div class="or">or</div>
    <input class="field" id="email" type="email" placeholder="email" autocomplete="email">
    <input class="field" id="pass" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn" id="emailBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
    <div class="swap" id="swap">New here? <b>Create an account</b></div>
  </div>
</div>

<!-- app -->
<div id="app">
  <aside id="side">
    <div class="side-top">
      <div class="brand grad">m.ai</div>
      <button class="newbtn" id="newChat">＋ New chat</button>
    </div>
    <div id="chatlist"></div>
    <div class="side-foot">
      <div class="avatar" id="avatar">?</div>
      <div class="who"><div class="n" id="uname">—</div><div class="e" id="uemail">—</div></div>
      <button class="icon" id="settingsBtn" title="Settings">⚙</button>
      <button class="icon" id="logoutBtn" title="Sign out">⏻</button>
    </div>
  </aside>

  <section id="main">
    <div class="topbar">
      <button class="menu" id="menuBtn">☰</button>
      <select class="model" id="model"></select>
      <div class="status"><span class="dot off" id="dot"></span><span id="statusTxt">connecting…</span></div>
    </div>
    <div id="scroll"><div class="thread" id="thread"></div></div>
    <div class="composer">
      <div class="wrap">
        <textarea id="input" rows="1" placeholder="Message the potato…  (it is a potato — double-check anything important)"></textarea>
        <button class="send" id="send">➤</button>
      </div>
      <div class="foot">m.ai models are tiny and trained from scratch. they will be confidently wrong. that's the fun.</div>
    </div>
  </section>
</div>

<!-- settings -->
<div id="modal">
  <div class="modal-card">
    <h3>Settings</h3>
    <p>Point the site at your model server.</p>
    <label class="lbl">Potato server URL (your Hugging Face Space)</label>
    <input class="field" id="apiUrl" placeholder="https://you-m-ai.hf.space">
    <div class="row">
      <button class="btn ghost" id="closeModal" style="flex:1">Cancel</button>
      <button class="btn" id="saveModal" style="flex:1">Save & reconnect</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc,
  query, orderBy, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const $ = id => document.getElementById(id);

// ── firebase init ──
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const gProvider = new GoogleAuthProvider();

// ── state ──
const S = {
  user: null, chats: [], chatId: null, msgs: [],
  api: localStorage.getItem('mai_api') || window.DEFAULT_API,
  connected: false, model: '', abort: null, unsub: null, streaming: false,
};

// ═══════════ AUTH ═══════════
let signupMode = false;
$('swap').onclick = () => {
  signupMode = !signupMode;
  $('emailBtn').textContent = signupMode ? 'Create account' : 'Sign in';
  $('swap').innerHTML = signupMode
    ? 'Have an account? <b>Sign in</b>' : 'New here? <b>Create an account</b>';
  $('loginErr').textContent = '';
};
$('googleBtn').onclick = async () => {
  try { await signInWithPopup(auth, gProvider); }
  catch (e) { $('loginErr').textContent = pretty(e); }
};
$('emailBtn').onclick = async () => {
  const em = $('email').value.trim(), pw = $('pass').value;
  if (!em || !pw) { $('loginErr').textContent = 'Email and password, please.'; return; }
  try {
    signupMode ? await createUserWithEmailAndPassword(auth, em, pw)
               : await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) { $('loginErr').textContent = pretty(e); }
};
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('emailBtn').click(); });
$('logoutBtn').onclick = () => signOut(auth);
const pretty = e => (e.code || e.message || '').replace('auth/', '').replace(/-/g, ' ') || 'something went wrong';

onAuthStateChanged(auth, user => {
  S.user = user;
  if (user) {
    $('login').classList.remove('show');
    $('app').classList.add('show');
    $('uname').textContent = user.displayName || user.email.split('@')[0];
    $('uemail').textContent = user.email;
    $('avatar').textContent = (user.displayName || user.email)[0].toUpperCase();
    watchChats();
    connect();
  } else {
    $('app').classList.remove('show');
    $('login').classList.add('show');
    if (S.unsub) S.unsub();
    S.chats = []; S.chatId = null; S.msgs = [];
  }
});

// ═══════════ FIRESTORE: chats live under users/{uid}/chats ═══════════
const chatsCol = () => collection(db, 'users', S.user.uid, 'chats');
function watchChats() {
  if (S.unsub) S.unsub();
  S.unsub = onSnapshot(query(chatsCol(), orderBy('updatedAt', 'desc')), snap => {
    S.chats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderChatList();
    if (!S.chatId && S.chats.length) openChat(S.chats[0].id);
  });
}
async function newChat() {
  const ref = await addDoc(chatsCol(), {
    title: 'New chat', model: S.model || '', messages: [],
    createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
  });
  openChat(ref.id);
  $('side').classList.remove('open');
}
async function saveChat() {
  if (!S.chatId) return;
  const c = S.chats.find(c => c.id === S.chatId);
  const title = (c && c.title !== 'New chat') ? c.title
    : (S.msgs.find(m => m.role === 'user')?.content.slice(0, 40) || 'New chat');
  await setDoc(doc(chatsCol(), S.chatId),
    { title, model: S.model, messages: S.msgs, updatedAt: serverTimestamp() }, { merge: true });
}
async function delChat(id, ev) {
  ev.stopPropagation();
  await deleteDoc(doc(chatsCol(), id));
  if (S.chatId === id) { S.chatId = null; S.msgs = []; renderThread(); }
}
function openChat(id) {
  S.chatId = id;
  const c = S.chats.find(c => c.id === id);
  S.msgs = c ? [...(c.messages || [])] : [];
  if (c && c.model) { S.model = c.model; if ([...$('model').options].some(o => o.value === c.model)) $('model').value = c.model; }
  renderChatList(); renderThread();
  $('side').classList.remove('open');
}

// ═══════════ RENDER ═══════════
function renderChatList() {
  const el = $('chatlist'); el.innerHTML = '';
  if (!S.chats.length) { el.innerHTML = '<div style="color:var(--faint);padding:12px;font-size:13px">No chats yet.</div>'; return; }
  for (const c of S.chats) {
    const row = document.createElement('div');
    row.className = 'chatrow' + (c.id === S.chatId ? ' active' : '');
    row.innerHTML = `<span>${esc(c.title || 'New chat')}</span><span class="x">×</span>`;
    row.onclick = () => openChat(c.id);
    row.querySelector('.x').onclick = e => delChat(c.id, e);
    el.appendChild(row);
  }
}
function renderThread() {
  const t = $('thread');
  if (!S.msgs.length) {
    t.innerHTML = `<div class="empty"><div class="big">🥔</div>say something to a potato.<br>it has been waiting its whole life.</div>`;
    return;
  }
  t.innerHTML = '';
  for (const m of S.msgs) {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
    d.innerHTML = `<div class="role">${m.role === 'user' ? 'you' : '🥔'}</div>`
      + `<div class="body${m.streaming ? ' cursor' : ''}">${esc(m.content)}</div>`;
    t.appendChild(d);
  }
  $('scroll').scrollTop = $('scroll').scrollHeight;
}
const esc = s => (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ═══════════ MODEL SERVER ═══════════
async function connect() {
  setStatus(false, 'connecting…');
  try {
    const r = await fetch(S.api + '/v1/models');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = (await r.json()).data || [];
    const sel = $('model'); sel.innerHTML = '';
    for (const m of data) {
      const o = document.createElement('option'); o.value = o.textContent = m.id; sel.appendChild(o);
    }
    // prefer a chat model
    const chat = data.find(m => /chat/.test(m.id));
    S.model = (chat || data[0] || {}).id || '';
    if (S.model) sel.value = S.model;
    S.connected = data.length > 0;
    setStatus(S.connected, S.connected ? `${data.length} models` : 'no models');
  } catch (e) {
    S.connected = false;
    setStatus(false, 'offline — check settings');
  }
}
function setStatus(ok, txt) {
  $('dot').className = 'dot' + (ok ? '' : ' off');
  $('statusTxt').textContent = txt;
}
$('model').onchange = () => { S.model = $('model').value; };

// ═══════════ SEND + STREAM ═══════════
async function send() {
  const text = $('input').value.trim();
  if (!text || S.streaming) return;
  if (!S.connected) { alert('The potato server is offline. Open ⚙ Settings and check the URL.\n(If it is on a Hugging Face Space it may be waking up — try again in ~30s.)'); return; }
  if (!S.chatId) await newChat();

  $('input').value = ''; autoGrow();
  S.msgs.push({ role: 'user', content: text });
  const reply = { role: 'assistant', content: '', streaming: true };
  S.msgs.push(reply);
  renderThread();
  S.streaming = true; $('send').disabled = true;
  S.abort = new AbortController();

  try {
    const r = await fetch(S.api + '/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: S.abort.signal,
      body: JSON.stringify({
        model: S.model, stream: true,
        messages: S.msgs.filter(m => !m.streaming).map(m => ({ role: m.role, content: m.content })),
      }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + (await r.text()).slice(0, 200));
    await readSSE(r, j => {
      const d = j.choices?.[0]?.delta?.content;
      if (d) { reply.content += d; renderThread(); }
    });
  } catch (e) {
    if (e.name !== 'AbortError') reply.content += (reply.content ? '\n\n' : '') + '⚠️ ' + e.message;
  }
  reply.streaming = false;
  S.streaming = false; $('send').disabled = false;
  renderThread();
  saveChat();
}
async function readSSE(resp, onEvent) {
  const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const l of lines) {
      const t = l.replace(/^data:\s*/, '').trim();
      if (t && t !== '[DONE]') { try { onEvent(JSON.parse(t)); } catch {} }
    }
  }
}

// ═══════════ UI wiring ═══════════
$('send').onclick = send;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', autoGrow);
function autoGrow() { const i = $('input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 180) + 'px'; }
$('newChat').onclick = newChat;
$('menuBtn').onclick = () => $('side').classList.toggle('open');
$('settingsBtn').onclick = () => { $('apiUrl').value = S.api; $('modal').classList.add('show'); };
$('closeModal').onclick = () => $('modal').classList.remove('show');
$('saveModal').onclick = () => {
  const v = $('apiUrl').value.trim().replace(/\/+$/, '');
  if (v) { S.api = v; localStorage.setItem('mai_api', v); }
  $('modal').classList.remove('show'); connect();
};
</script>
</body>
</html>
