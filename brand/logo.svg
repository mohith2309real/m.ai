<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <!-- m.ai — geometric futurist wordmark (Azonix-inspired), drawn as paths
       so it renders identically everywhere; no fonts required. -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#22d3aa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#g)" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- M -->
    <polyline points="55,170 55,60 112,130 169,60 169,170"/>
    <!-- . -->
    <circle cx="212" cy="160" r="12" fill="url(#g)" stroke="none"/>
    <!-- A — clear apex, floating crossbar -->
    <polyline points="258,170 300,60 342,170"/>
    <line x1="278" y1="126" x2="322" y2="126"/>
    <!-- I -->
    <line x1="388" y1="60" x2="388" y2="170"/>
    <circle cx="388" cy="30" r="6" fill="url(#g)" stroke="none"/>
  </g>

  <text x="428" y="170" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="17" font-weight="700" letter-spacing="6" fill="url(#g)">LAB</text>
  <text x="57" y="212" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="13" letter-spacing="5" fill="#8a93ab">BASEMENT FRONTIER · MODELS FROM SCRATCH</text>
</svg>
