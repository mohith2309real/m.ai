<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <!-- m.ai — geometric futurist wordmark, drawn as paths (no fonts needed) -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="443" y2="175">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#22d3aa"/>
    </linearGradient>
  </defs>

  <g stroke="url(#g)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- M -->
    <polyline points="60,175 60,60 120,135 180,60 180,175"/>
    <!-- . -->
    <circle cx="228" cy="163" r="13" fill="url(#g)" stroke="none"/>
    <!-- A — clear apex, floating crossbar -->
    <polyline points="278,175 322,60 366,175"/>
    <line x1="299" y1="128" x2="345" y2="128"/>
    <!-- I — tall bar with a big dot right above it -->
    <line x1="430" y1="95" x2="430" y2="175"/>
    <circle cx="430" cy="52" r="13" fill="url(#g)" stroke="none"/>
  </g>

  <text x="62" y="215" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="13" letter-spacing="5" fill="#8a93ab">BASEMENT FRONTIER · MODELS FROM SCRATCH</text>
</svg>
