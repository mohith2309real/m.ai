<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m.ai — potatoes in your browser</title>
<style>
  :root{--bg:#0b0d14;--panel:#11141f;--panel2:#161a28;--line:#232838;--ink:#e8eaf3;
    --dim:#8b93a7;--faint:#5b6478;--violet:#7c5cff;--grad:linear-gradient(135deg,#7c5cff,#4aa8ff)}
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column}
  .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
  .tag{color:var(--faint);font-size:12.5px}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:7px 10px;outline:none}
  .status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px}
  .dot{width:8px;height:8px;border-radius:50%;background:#e0a63a}
  .dot.ready{background:#3ad07f}.dot.err{background:#ff6b6b}
  #scroll{flex:1;overflow:auto}
  .thread{max-width:760px;margin:0 auto;padding:26px 20px 40px}
  .empty{color:var(--faint);text-align:center;margin-top:14vh}
  .empty .big{font-size:44px;margin-bottom:10px}
  .msg{display:flex;gap:14px;margin:22px 0}
  .msg .role{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .msg.user .role{background:var(--grad);color:#fff}
  .msg.bot .role{background:var(--panel2);border:1px solid var(--line)}
  .msg .body{padding-top:3px;white-space:pre-wrap;word-wrap:break-word;flex:1;min-width:0}
  .cursor::after{content:"▋";color:var(--violet);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .composer{border-top:1px solid var(--line);padding:14px 20px}
  .wrap{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
  .wrap:focus-within{border-color:var(--violet)}
  #input{flex:1;background:none;border:none;color:var(--ink);resize:none;outline:none;
    max-height:160px;padding:6px 0;line-height:1.5}
  .send{background:var(--grad);border:none;color:#fff;border-radius:10px;width:40px;height:40px;
    flex:0 0 auto;font-size:17px;cursor:pointer}
  .send:disabled{opacity:.4;cursor:default}
  .foot{max-width:760px;margin:8px auto 0;color:var(--faint);font-size:11.5px;text-align:center}
  .bar{max-width:760px;margin:0 auto;height:3px;background:var(--panel2);border-radius:3px;overflow:hidden;display:none}
  .bar.show{display:block}.bar>i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
</style>
</head>
<body>
<header>
  <span class="logo grad">m.ai</span>
  <span class="tag">running 100% in your browser · no server</span>
  <select id="model">
    <option value="potus-chat">potus-chat (16M · fastest)</option>
  </select>
  <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">loading…</span></div>
</header>
<div class="bar" id="bar"><i id="barfill"></i></div>
<div id="scroll"><div class="thread" id="thread"></div></div>
<div class="composer">
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="Message the potato…  (first load downloads the model once, then it's instant + offline)"></textarea>
    <button class="send" id="send" disabled>➤</button>
  </div>
  <div class="foot">the model runs on your device. it is a 16-51M potato trained from scratch — confidently wrong, and entirely yours.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script type="module">
import { encode, decode } from 'https://cdn.jsdelivr.net/npm/gpt-tokenizer@2.9.0/esm/encoding/r50k_base.js';

const $ = id => document.getElementById(id);
const EOT = 50256, BLOCK = 128;
// potus-chat sampling profile (matches the m.ai server registry)
const PROFILE = { temperature: 0.7, top_k: 50, repeat_penalty: 1.15, max_new: 200 };
const STOP_MARKERS = ['<|user|>', '<|mai|>'];

let session = null, msgs = [], busy = false;

ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';

function setStatus(cls, txt){ $('dot').className = 'dot ' + cls; $('statusTxt').textContent = txt; }

async function loadModel(name){
  setStatus('', 'downloading ' + name + '…');
  $('bar').classList.add('show');
  try{
    // fetch with progress so the one-time download isn't a mystery
    const resp = await fetch('./' + name + '/model.onnx');
    const total = +resp.headers.get('content-length') || 0;
    const reader = resp.body.getReader(); const chunks = []; let got = 0;
    for(;;){ const {done, value} = await reader.read(); if(done) break;
      chunks.push(value); got += value.length;
      if(total) $('barfill').style.width = (got/total*100).toFixed(0) + '%'; }
    const buf = new Uint8Array(got); let off = 0;
    for(const c of chunks){ buf.set(c, off); off += c.length; }
    setStatus('', 'starting…');
    session = await ort.InferenceSession.create(buf.buffer, { executionProviders: ['wasm'] });
    $('bar').classList.remove('show');
    setStatus('ready', 'ready · offline');
    $('send').disabled = false;
  }catch(e){ setStatus('err', 'load failed'); console.error(e);
    $('thread').innerHTML = '<div class="empty">⚠️ could not load the model:<br>'+e.message+'</div>'; }
}

// ── one forward pass: token ids -> logits at the last position ──
async function forward(ids){
  const ctx = ids.slice(-BLOCK);
  const input = new ort.Tensor('int64', BigInt64Array.from(ctx.map(BigInt)), [1, ctx.length]);
  const out = await session.run({ input_ids: input });
  const logits = out.logits.data;               // [1, seq, 50257] flattened
  const V = 50257, last = (ctx.length - 1) * V;
  return logits.slice(last, last + V);          // Float32Array length 50257
}

// ── sampling that mirrors mai_serve.generate_ids (chat: penalize own output only) ──
function sample(logits, generated){
  const l = Float32Array.from(logits);
  // repetition penalty on tokens the model itself produced
  const pen = PROFILE.repeat_penalty;
  if(pen > 1) for(const t of generated){ if(t===EOT) continue;
    l[t] = l[t] > 0 ? l[t]/pen : l[t]*pen; }
  const temp = Math.max(PROFILE.temperature, 1e-5);
  for(let i=0;i<l.length;i++) l[i] /= temp;
  // top-k mask
  const k = Math.min(PROFILE.top_k, l.length);
  const kth = Float32Array.from(l).sort((a,b)=>b-a)[k-1];
  let max = -Infinity;
  for(let i=0;i<l.length;i++){ if(l[i] < kth) l[i] = -Infinity; else if(l[i]>max) max=l[i]; }
  // softmax + multinomial
  let sum = 0; const p = new Float32Array(l.length);
  for(let i=0;i<l.length;i++){ const e = l[i]===-Infinity?0:Math.exp(l[i]-max); p[i]=e; sum+=e; }
  let r = Math.random()*sum;
  for(let i=0;i<l.length;i++){ r -= p[i]; if(r<=0) return i; }
  return EOT;
}

// trim at a hallucinated turn marker; hold back a partial marker mid-stream
function trimStops(text){
  let cut = -1;
  for(const s of STOP_MARKERS){ const i = text.indexOf(s); if(i>=0 && (cut<0||i<cut)) cut=i; }
  if(cut>=0) return { text: text.slice(0,cut), hit: true };
  for(let n=Math.min(text.length, 8); n>0; n--){ const tail = text.slice(-n);
    if(STOP_MARKERS.some(s=>s.startsWith(tail))) return { text: text.slice(0,-n), hit:false }; }
  return { text, hit:false };
}

function buildPrompt(){
  let s = '';
  for(const m of msgs){ if(m.streaming) continue;
    s += m.role==='user' ? `<|user|>\n${m.content}\n` : `<|mai|>\n${m.content}<|endoftext|>`; }
  return s + '<|mai|>\n';
}

async function send(){
  const text = $('input').value.trim();
  if(!text || busy || !session) return;
  $('input').value=''; autoGrow();
  msgs.push({ role:'user', content:text });
  const reply = { role:'assistant', content:'', streaming:true };
  msgs.push(reply); render(); busy=true; $('send').disabled=true;

  const ids = encode(buildPrompt());
  const generated = [];
  for(let step=0; step<PROFILE.max_new; step++){
    const logits = await forward(ids.concat(generated));
    const next = sample(logits, generated);
    if(next===EOT) break;
    generated.push(next);
    const { text:shown, hit } = trimStops(decode(generated));
    reply.content = shown; render();
    if(hit) break;
    await new Promise(r=>setTimeout(r));   // yield so the UI paints each token
  }
  reply.streaming=false; busy=false; $('send').disabled=false; render();
}

function render(){
  const t = $('thread');
  if(!msgs.length){ t.innerHTML = '<div class="empty"><div class="big">🥔</div>a whole language model, in your browser.<br>say something.</div>'; return; }
  t.innerHTML='';
  for(const m of msgs){ const d=document.createElement('div');
    d.className='msg '+(m.role==='user'?'user':'bot');
    d.innerHTML=`<div class="role">${m.role==='user'?'you':'🥔'}</div>`+
      `<div class="body${m.streaming?' cursor':''}"></div>`;
    d.querySelector('.body').textContent = m.content;
    t.appendChild(d); }
  $('scroll').scrollTop = $('scroll').scrollHeight;
}

$('send').onclick = send;
$('input').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});
$('input').addEventListener('input', autoGrow);
function autoGrow(){ const i=$('input'); i.style.height='auto'; i.style.height=Math.min(i.scrollHeight,160)+'px'; }
$('model').onchange = () => { $('send').disabled=true; loadModel($('model').value); };

render();
loadModel('potus-chat');
</script>
</body>
</html>
